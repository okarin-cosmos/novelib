name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out NoveLib
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Flutter 3.47.2
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'novelib-flutter'
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git -C $sdk rev-parse HEAD) -ne 'd3b14c876900e553bc736ca19295fc09e3853e8e') {
            throw 'Unexpected Flutter SDK revision.'
          }
          Join-Path $sdk bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Resolve locked dependencies
        working-directory: source/app
        run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Analyze
        working-directory: source/app
        run: flutter --suppress-analytics analyze --no-pub
      - name: Test
        working-directory: source/app
        run: flutter --suppress-analytics test --no-pub --concurrency=1
      - name: Build Windows x64
        working-directory: source/app
        run: flutter --suppress-analytics build windows --release --no-pub
